name: Hourly Traffic News Notification

on:
  schedule:
    # 日本時間 09:00〜18:00（UTC 00:00〜09:00）の毎時0分に実行
    - cron: '0 0-9 * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  notify-traffic:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.10 のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install google-genai feedparser requests

      - name: 交通ニュース収集＆Discord配信の実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python traffic_summary.py
