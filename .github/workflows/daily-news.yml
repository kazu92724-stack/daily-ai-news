name: Daily AI & Medical News Summary

on:
  schedule:
    # 毎日 朝10:00 (JST) に自動実行 (UTC 01:00)
    - cron: '0 1 * * *'
  workflow_dispatch: # 手動実行用

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai feedparser

      - name: Run News Summary Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_summary.py

      - name: Commit and Push feed.xml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update feed.xml [skip ci]" && git push)
