name: Daily News Summary

on:
  schedule:
    # 混雑を避けるため、毎日朝6:43 JST (21:43 UTC) に設定
    - cron: '43 21 * * *'
  workflow_dispatch:

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # feed.xml の自動コミット用権限

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.10 のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests beautifulsoup4 feedparser

      - name: ニュース要約＆Discord配信の実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python news_summary.py

      - name: feed.xml の変更を自動コミット
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "Update daily feed.xml [skip ci]" || exit 0
          git push
