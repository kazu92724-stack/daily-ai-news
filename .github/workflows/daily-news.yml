name: Daily News Summary & Notification

on:
  schedule:
    - cron: '0 22 * * *' # 毎日 午前7:00 (JST)
  workflow_dispatch: # 手動実行ボタン

jobs:
  build-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.10 のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install google-genai feedparser requests beautifulsoup4

      - name: ニュース要約＆Discord配信の実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python news_summary.py

      - name: 生成された feed.xml をコミットしてPush
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update feed.xml [skip ci]" && git push)
