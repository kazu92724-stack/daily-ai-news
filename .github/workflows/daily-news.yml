name: Daily News Summary RSS Generator

on:
  schedule:
    # 毎日 1:00 UTC (10:00 JST) に自動実行
    - cron: '0 1 * * *'
  workflow_dispatch: # 手動実行用ボタン有効化

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Run news summary script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_summary.py

      - name: Commit and Push feed.xml
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add feed.xml
          git commit -m "Auto-update RSS feed [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin main
